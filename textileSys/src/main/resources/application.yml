spring:
  application:
    name: textileSys
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/textile_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:2549}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    baseline-on-migrate: true
  jackson:
    date-format: yyyy-MM-dd
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-this-jwt-secret-32-bytes-minimum}
  auth:
    email: ${AUTH_EMAIL:admin@iktextile.com}
    password: ${AUTH_PASSWORD:2549}
